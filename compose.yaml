services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: talent_dev
      POSTGRES_USER: talent_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - talent_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent_dev -d talent_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  talent_dev_db:
