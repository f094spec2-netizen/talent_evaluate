name: Backend checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: talent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d talent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://test_user:test_only@localhost:5432/talent_test
      TEST_POSTGRES_URL: postgresql+psycopg://test_user:test_only@localhost:5432/talent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests migrations
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m pytest -q
      - name: Public synthetic business regression (never private cases)
        run: python -m app.acceptance.cli public-regression --file output/public-acceptance-baseline.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-synthetic-regression
          path: output/public-acceptance-baseline.json
          if-no-files-found: ignore
      - run: docker build -t talent-intake-test .
